# Size-normalised distance association (see detection/river_tracker.py).
# Night regime: measured displacement 0.31 times the object size between two frames.
tracker_type: river
track_high_thresh: 0.15
track_low_thresh: 0.05
new_track_thresh: 0.20
track_buffer: 30          # 10 s at 3 fps
match_thresh: 0.8         # 0.8 x max_move_ratio = 3.2 object sizes
fuse_score: False         # designed for an IoU similarity, meaningless here
max_move_ratio: 4.0
